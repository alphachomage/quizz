# Configuration Cloudflare Workers pour VQuizz (lue par @cloudflare/vite-plugin
# en développement, et par `npx wrangler deploy` après `npm run build`).
#
# En dev, le plugin sert le dossier ./public comme assets statiques (binding ASSETS).
# Au build, le plugin génère tout seul la config de déploiement avec les assets
# compilés dans dist/client et le Worker dans dist/voltquiz.

name = "voltquiz"                  # -> https://voltquiz.joris-leo81.workers.dev
main = "worker.ts"                 # point d'entrée du Worker (esbuild compile le TS nativement)
compatibility_date = "2025-11-19"  # date de compatibilité de l'API Workers

[assets]
directory = "./public"             # assets servis tels quels en dev (icônes, JSON...)
binding = "ASSETS"                 # utilisé dans worker.ts via env.ASSETS
run_worker_first = true            # CHAQUE requête passe d'abord par worker.ts
                                   # (sinon Cloudflare sert les fichiers directement)

# Variables d'environnement du Worker (lue dans worker.ts via env.*)

# --- Bindings base de données (D1 = base serveur, active en dev local, preview et prod) ---
# D1 = base de données serveur (sync_client, comptes, parties, records, XP, soumissions).
# database_id : créé avec "npx wrangler d1 create voltquiz" (voir docs/stockage-d1.md).
[[d1_databases]]
binding = "DB"
database_name = "voltquiz"
database_id = "3b0a1123-13c6-4d55-8872-d817138fdbd7"  # créé avec npx wrangler d1 create voltquiz
migrations_dir = "migrations"

# KV = rooms de duel éphémères (duel en ligne, préparé).
[[kv_namespaces]]
binding = "ROOMS"
id = "2e95c8f1ba2449b5b83f9614d1aa12a9"  # créé avec npx wrangler kv namespace create ROOMS

# Durable Object = room de duel temps réel (WebSocket /api/duel/<room>).
[[durable_objects.bindings]]
name = "DUEL_ROOMS"
class_name = "DuelRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DuelRoom"]

[env.preview]
ENVIRONMENT = "preview"
CSP_REPORT_ONLY = "true"

[vars]
ENVIRONMENT = "production"
APP_VERSION = "0.1.0"
# CSP APPLIQUÉE en prod (script-src 'self', object-src 'none', frame-ancestors 'none'...).
# Les rapports restent reçus sur /api/csp-report (report-uri) pour surveiller.
# En preview (env.preview ci-dessus) : Report-Only pour observer avant prod.
CSP_REPORT_ONLY = "false"
ALLOWED_ORIGINS = "https://voltquiz.joris-leo81.workers.dev"
# Accès admin : PAS de var d'env — flag admin=1 sur le compte en table D1
# (colonne comptes.admin, migration 0003), vérifié via /api/admin/check.
# Promouvoir un compte : npx wrangler d1 execute voltquiz --remote --command \
#   "UPDATE comptes SET admin = 1 WHERE pseudo_normalise = 'tonpseudo'"
